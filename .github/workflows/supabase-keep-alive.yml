name: Keep Supabase Alive

on:
  schedule:
    # Runs automatically every 3 days at midnight UTC
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node -e '
            const { createClient } = require("@supabase/supabase-js");
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_KEY);
            async function run() {
              const { data, error } = await supabase.from("keep_alive").insert([{ }]);
              if (error) {
                console.error("Ping failed:", error);
                process.exit(1);
              }
              console.log("Supabase successfully pinged and kept alive!");
            }
            run();
          '
